<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG Subtitle Translator</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
        textarea { width: 100%; height: 150px; background: #1e293b; color: #fff; border: 1px solid #475569; padding: 10px; border-radius: 8px; box-sizing: border-box; }
        button { background: #6366f1; color: white; border: none; padding: 12px 20px; margin-top: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .output { margin-top: 20px; background: #1e293b; padding: 15px; border-radius: 8px; white-space: pre-wrap; min-height: 100px; border: 1px solid #475569; }
    </style>
</head>
<body>
    <h2>English to Sinhala Subtitle Translator</h2>
    <textarea id="subInput" placeholder="Paste English subtitle or text here..."></textarea>
    <button onclick="translateSub()">Translate to Sinhala</button>
    
    <h3>Translated Output:</h3>
    <div class="output" id="subOutput">Result will appear here...</div>

    <script>
        async function translateSub() {
            const text = document.getElementById('subInput').value;
            const outputDiv = document.getElementById('subOutput');
            if(!text) return alert('Please enter some text!');
            
            outputDiv.innerText = "Translating with Gemini API...";

            try {
                const res = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if(data.success) {
                    outputDiv.innerText = data.translatedText;
                } else {
                    outputDiv.innerText = "Error: " + data.error;
                }
            } catch(err) {
                outputDiv.innerText = "Network Error: " + err.message;
            }
        }
    </script>
</body>
</html>
